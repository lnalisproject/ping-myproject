name: Keepalive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -f -sS "${{ secrets.SUPABASE_URL }}/rest/v1/ping?select=id" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \

      - name: Commit vide (garde le dépôt actif)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push

      - name: Nettoyer les anciens runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow keepalive.yml --limit 100 --json databaseId -q '.[10:][].databaseId' \
            | xargs -r -I{} gh run delete {}

