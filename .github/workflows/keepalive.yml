name: Keepalive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Longueur de la clé : ${#SB_KEY}"
          echo "Début de la clé : ${SB_KEY:0:12}"
          curl -f -sS "$SB_URL/rest/v1/ping?select=id" -H "apikey: $SB_KEY"

      - name: Commit vide (garde le dépôt actif)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
